<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bracket Template Filler</title>
  <style>
    body { font-family: system-ui, Arial, sans-serif; padding: 16px; line-height: 1.4; }
    .row { margin: 10px 0; }
    .templatePreview {
      padding: 12px; border: 1px solid #ccc; border-radius: 8px;
      background: #fafafa; white-space: pre-wrap;
    }
    .placeholderInput {
      display: inline-block; min-width: 80px; max-width: 220px;
      padding: 2px 6px; margin: 0 2px;
      border: 1px solid #999; border-radius: 6px;
      font: inherit; vertical-align: baseline; background: #fff;
    }
    textarea { width: 100%; min-height: 110px; font-family: ui-monospace, Menlo, Consolas, monospace; }
    .hint { color: #555; font-size: 13px; }
  </style>
</head>

<body>
  <div class="row">
    <div class="hint">Template (anything inside <code>[ ... ]</code> becomes an inline text box):</div>
    <textarea id="templateInput">The [MON] targets all creatures within [#] ft of it. [MON] then retreats. Each target must make a DC [SAVE_DC] [SAVE_TYPE] saving throw, taking [#dX] [DMG_TYPE] damage on a failed save.</textarea>
  </div>

  <div class="row">
    <div class="hint">Fill in the fields:</div>
    <div id="preview" class="templatePreview"></div>
  </div>

  <div class="row">
    <div class="hint">Output:</div>
    <textarea id="output" readonly></textarea>
  </div>

  <div class="row">
    <button id="rebuildBtn">Rebuild from Template</button>
    <button id="copyBtn">Copy Output</button>
  </div>

  <!-- popup modal for advanced customization -->
  <div id="popupModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);align-items:center;justify-content:center;">
    <div style="background:#fff;padding:20px;border-radius:8px;max-width:400px;margin:auto;">
      <h3 id="popupTitle"></h3>
      <textarea id="popupTextarea" style="width:100%;height:100px;"></textarea>
      <div style="text-align:right;margin-top:8px;">
        <button id="popupCancel">Cancel</button>
        <button id="popupOk">OK</button>
      </div>
    </div>
  </div>
	<script>
    const output = document.getElementById('output');               // Output textarea.
    const rebuildBtn = document.getElementById('rebuildBtn');       // Rebuild button.
    const copyBtn = document.getElementById('copyBtn');             // Copy button.

    let parts = [];                      // Parsed template parts (text or slot).
    const slotInputs = new Map();        // slotId -> input element (for independent slots).
    const monInputs = [];                // list of all input elements for the [MON] token.
    const customTexts = new Map();       // slotId -> custom text for complex tokens

    // references related to the popup dialog
    let currentPopupSlot = null;         // object { id, key }
    const popupModal = document.getElementById('popupModal');
    const popupTitle = document.getElementById('popupTitle');
    const popupTextarea = document.getElementById('popupTextarea');
    const popupOk = document.getElementById('popupOk');
    const popupCancel = document.getElementById('popupCancel');

    const TOKEN_REGEX = /\[([^\[\]]+)\]/g; // Finds bracketed tokens like [MON].

    function parseTemplate(templateString) {
      const parsed = [];                // Accumulates parsed parts.
      let lastIndex = 0;                // Tracks where the previous match ended.
      let slotId = 0;                   // Unique id per slot occurrence.

      for (const match of templateString.matchAll(TOKEN_REGEX)) {
        const start = match.index;      // Start index of the match.
        const full = match[0];          // Full token including brackets, e.g. "[MON]".
        const key = match[1];           // Inner token text, e.g. "MON".

        if (start > lastIndex) {        // If there's text before this token...
          parsed.push({ type: 'text', value: templateString.slice(lastIndex, start) }); // ...store it.
        }

        parsed.push({ type: 'slot', key, id: slotId++ }); // Store a slot part with unique occurrence id.
        lastIndex = start + full.length;                  // Advance past this token.
      }

      if (lastIndex < templateString.length) {            // Add any trailing text after last token.
        parsed.push({ type: 'text', value: templateString.slice(lastIndex) });
      }

      return parsed;                                      // Return parsed parts array.
    }

    // Sync all [MON] input boxes to the same value (but only for MON).
    function syncMonInputs(sourceInput) {
      const v = sourceInput.value;                        // Read the typed value from the source input.
      for (const inp of monInputs) {                      // For every [MON] input on the page...
        if (inp !== sourceInput) inp.value = v;           // ...copy the value (skip the one being typed in).
      }
    }

    // open a modal popup allowing the user to enter custom text
    function openPopup(part, buttonElement) {
      currentPopupSlot = { id: part.id, key: part.key, button: buttonElement };
      popupTitle.textContent = `Customize ${part.key}`;
      popupTextarea.value = customTexts.get(part.id) || '';
      popupModal.style.display = 'flex';
      popupTextarea.focus();
    }

    function closePopup() {
      popupModal.style.display = 'none';
      currentPopupSlot = null;
    }

    popupOk.addEventListener('click', () => {
      if (!currentPopupSlot) return;
      const text = popupTextarea.value.trim();
      customTexts.set(currentPopupSlot.id, text);
      // update button label
      if (currentPopupSlot.button) {
        currentPopupSlot.button.textContent = text || currentPopupSlot.key;
      }
      updateOutput();
      closePopup();
    });

    popupCancel.addEventListener('click', () => {
      closePopup();
    });

    function renderPreview() {
      preview.innerHTML = '';                             // Clear old UI.
      slotInputs.clear();                                 // Clear independent-slot references.
      monInputs.length = 0;                               // Clear [MON] references.

      for (const part of parts) {                         // Walk template parts in order.
        if (part.type === 'text') {                       // If it's plain text...
          preview.appendChild(document.createTextNode(part.value)); // ...append a text node.
        } else {                                          // Otherwise it's a slot...
          let input;

          // special-case tokens that need a popup button
          if (['DURATION','OUTCOME','TGT_EFFECT'].includes(part.key)) {
            input = document.createElement('button');
            input.className = 'placeholderInput';
            input.dataset.slotId = String(part.id);
            input.textContent = customTexts.get(part.id) || part.key;
            input.addEventListener('click', () => openPopup(part, input));
          } else if (part.key === 'SAVE_TYPE') {
            // create dropdown for saving throw types
            input = document.createElement('select');
            input.className = 'placeholderInput';
            input.dataset.slotId = String(part.id);
            const options = ['Strength', 'Dexterity', 'Constitution', 'Intelligence', 'Wisdom', 'Charisma'];
            const placeholderOption = document.createElement('option');
            placeholderOption.value = '';
            placeholderOption.textContent = part.key;
            placeholderOption.disabled = true;
            placeholderOption.selected = true;
            input.appendChild(placeholderOption);
            for (const opt of options) {
              const o = document.createElement('option');
              o.value = opt;
              o.textContent = opt;
              input.appendChild(o);
            }
          } else {
            input = document.createElement('input');   // Create an <input>.
            input.type = 'text';                            // Make it a text input.
            input.className = 'placeholderInput';           // Apply styling class.
            input.placeholder = part.key;                   // Show token name as hint.
            input.dataset.slotId = String(part.id);         // Store slot id for inspection/debug.
          }

          if (part.key === 'MON') {                       // Special case: share value for [MON] only.
            monInputs.push(input);                        // Remember this input as a MON input.

            input.addEventListener('input', () => {        // When user types in any MON box...
              syncMonInputs(input);                       // ...sync all other MON boxes to match.
              updateOutput();                             // ...then rebuild output.
            });
          } else if (['DURATION','OUTCOME','TGT_EFFECT'].includes(part.key)) {
            // button; text is managed through customTexts map
            slotInputs.set(part.id, input);               // still keep it for lookup if needed
          } else {                                        // All other tokens remain independent.
            slotInputs.set(part.id, input);               // Map this unique slot occurrence to its input.

            input.addEventListener('input', updateOutput); // Typing updates output.
            // also respond to change event (for selects)
            input.addEventListener('change', updateOutput);
          }

          preview.appendChild(input);                     // Insert input inline.
        }
      }
    }

    function updateOutput() {
      let result = '';                                    // Accumulate final output string.

      for (const part of parts) {                         // Walk parsed parts in order.
        if (part.type === 'text') {                       // Text parts are appended as-is.
          result += part.value;
        } else if (part.key === 'MON') {                  // For [MON], use the shared value.
          const shared = (monInputs[0]?.value ?? '').trim(); // Read value from the first MON input.
          result += shared;                               // Append the shared value.
        } else if (['DURATION','OUTCOME','TGT_EFFECT'].includes(part.key)) {
          // custom buttons provide stored text
          result += (customTexts.get(part.id) || '');
        } else {                                          // For all other tokens, use independent value.
          const input = slotInputs.get(part.id);          // Get the input for that unique slot occurrence.
          result += ((input?.value ?? '').trim());        // Append typed text (or empty).
        }
      }

      output.value = result;                               // Display final combined text.
    }

    function rebuildFromTemplate() {
      parts = parseTemplate(templateInput.value);          // Parse template into parts.
      customTexts.clear();                                 // drop previous custom values – slot IDs will change
      renderPreview();                                     // Render text + inputs.
      updateOutput();                                      // Compute initial output.
    }

    rebuildBtn.addEventListener('click', rebuildFromTemplate); // Manual rebuild.

    let rebuildTimer = null;                               // Debounce timer id.
    templateInput.addEventListener('input', () => {         // Rebuild after user edits template.
      clearTimeout(rebuildTimer);                          // Cancel previous timer.
      rebuildTimer = setTimeout(rebuildFromTemplate, 200);  // Rebuild after short pause.
    });

    copyBtn.addEventListener('click', async () => {         // Copy output handler.
      await navigator.clipboard.writeText(output.value);    // Copy output text to clipboard.
    });

    rebuildFromTemplate();                                  // Build initial UI at load time.
  </script>
</body>
</html>
